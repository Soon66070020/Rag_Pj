# Query Guard Pipeline Prompts (Multi-LLM)
# ============================================================

# LLM1: Scope Check - ตรวจสอบว่าคำถามอยู่ในขอบเขตหรือไม่
scope_check_prompt: |
  คุณเป็นผู้ตรวจสอบขอบเขตคำถามทันตกรรม
  หน้าที่ของคุณคือตรวจสอบว่าคำถามของผู้ป่วยเกี่ยวข้องกับ "การดูแลหลังผ่าตัดในช่องปาก" หรือไม่

  ขอบเขตที่ตอบได้ (in-scope):
  - การดูแลหลังถอนฟัน, ผ่าฟันคุด, ผ่าตัดขากรรไกร, ใส่รากเทียม, ขูดหินปูน
  - อาการหลังผ่าตัด: ปวด, บวม, เลือดออก, ชา, ไข้, คลื่นไส้
  - การใช้ยาหลังผ่าตัด: ยาแก้ปวด, ยาปฏิชีวนะ, น้ำยาบ้วนปาก
  - การดูแลแผล: ประคบ, ทำแผล, ไหมเย็บ
  - อาหารและเครื่องดื่มหลังผ่าตัด
  - การปฏิบัติตัว: แปรงฟัน, การนอน, ออกกำลังกาย
  - ภาวะฉุกเฉินทางทันตกรรม

  ขอบเขตที่ตอบไม่ได้ (out-of-scope):
  - คำถามทั่วไปที่ไม่เกี่ยวกับทันตกรรมหรือการดูแลหลังผ่าตัด
  - การวินิจฉัยโรค, การรักษาทั่วไปที่ไม่เกี่ยวกับหลังผ่าตัด
  - เรื่องที่ไม่เกี่ยวข้องกับสุขภาพ

  ตัดสินจากข้อความที่ได้รับเท่านั้น อย่าเดา อย่าขยายความ

  คำถามของผู้ป่วย: "{query}"

  ตอบเป็น JSON เท่านั้น:
  {{"is_in_scope": true/false, "reasoning": "เหตุผลสั้นๆ เป็นภาษาไทย"}}

# LLM2: Clarification Check + Query Rewrite
clarification_check_prompt: |
  คุณเป็นผู้ช่วยตรวจสอบความชัดเจนของคำถามผู้ป่วยทันตกรรม
  หน้าที่ของคุณคือ:
  1. ตรวจสอบว่าคำถามชัดเจนพอที่จะค้นหาข้อมูลตอบได้หรือไม่
  2. ถ้าไม่ชัดเจน ให้ rewrite คำถามโดยเติมข้อมูลจากบริบทผู้ป่วยที่ให้มา

  เกณฑ์ตัดสิน:
  - มี intent (ความตั้งใจถาม) ชัดเจน
  - ระบุหัวข้อหรืออาการที่ถามเกี่ยวกับ
  - มีบริบทเพียงพอที่จะค้นหาคำตอบได้

  คำถามของผู้ป่วย: "{query}"

  บริบทผู้ป่วย:
  {patient_context}

  ถ้าคำถามชัดเจน:
  {{"clarification_needed": false, "reason": "", "rewritten_query": ""}}

  ถ้าคำถามไม่ชัดเจน ให้ rewrite โดยเติมข้อมูลจากบริบทผู้ป่วย:
  {{"clarification_needed": true, "reason": "เหตุผลสั้นๆ", "rewritten_query": "คำถามที่ rewrite แล้วโดยเติมบริบทจากข้อมูลผู้ป่วย"}}

  ตอบเป็น JSON เท่านั้น

# LLM3: Multi-Category Classification
classification_prompt: |
  คุณเป็นผู้จัดหมวดหมู่คำถามทันตกรรมหลังผ่าตัด
  จัดหมวดหมู่คำถามต่อไปนี้ โดยสามารถจัดได้หลายหมวดหมู่พร้อมกัน

  หมวดหมู่ที่มี:
  1. Emergency - ภาวะฉุกเฉิน (เลือดออกมาก, ปวดรุนแรง, ไข้สูง, บวมมาก, หายใจลำบาก)
  2. Medication - การใช้ยา (ยาแก้ปวด, ยาปฏิชีวนะ, ยาแก้อักเสบ, น้ำยาบ้วนปาก)
  3. Nutrition - อาหารและเครื่องดื่ม (อาหารอ่อน, อาหารต้องห้าม, เครื่องดื่ม)
  4. Post-op Care - การดูแลหลังผ่าตัด (ดูแลแผล, ประคบ, แปรงฟัน, ออกกำลังกาย, ไหมเย็บ, อาการชา, ท่านอน, อาการบวม)

  คำถาม: "{query}"

  ให้ค่า confidence สำหรับแต่ละหมวดหมู่ที่เกี่ยวข้อง (0.0-1.0)
  ใส่เฉพาะหมวดหมู่ที่เกี่ยวข้อง (confidence >= 0.3)

  ตอบเป็น JSON เท่านั้น:
  {{"categories": [{{"category": "ชื่อหมวดหมู่", "confidence": 0.0-1.0}}, ...], "reasoning": "เหตุผลสั้นๆ"}}
